name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch optimized game models
        run: |
          git lfs pull --include="models/web/*.glb,models/figure_360.glb,models/serame-head.glb,models/rabbit_-_realistic_3d_model_demo_free.glb" --exclude=""
          mkdir -p app/src/main/assets/models
          cp models/web/*.glb app/src/main/assets/models/
          cp models/figure_360.glb models/serame-head.glb models/rabbit_-_realistic_3d_model_demo_free.glb app/src/main/assets/models/
          for model in app/src/main/assets/models/*.glb; do
            test "$(head -c 4 "$model")" = "glTF" || { echo "Missing LFS model: $model"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIFTWATCH-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
